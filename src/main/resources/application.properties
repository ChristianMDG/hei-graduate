spring.config.import=optional:file:.env[.properties]

# Neon PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
server.port=8081

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Flyway est la seule source de verite pour le schema. Hibernate ne doit jamais l'alterer lui-meme.
spring.jpa.hibernate.ddl-auto=validate

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Admin seeder (cree un compte ADMIN au demarrage si absent)
admin.seed.email=${ADMIN_SEED_EMAIL:}
admin.seed.password=${ADMIN_SEED_PASSWORD:}

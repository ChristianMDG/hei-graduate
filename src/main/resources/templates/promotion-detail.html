<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEI Graduate — Diplômés</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --background: #f6f8fc;
            --surface: #ffffff;
            --text: #172033;
            --muted: #667085;
            --border: #e6eaf0;
            --success: #027a48;
            --success-bg: #ecfdf3;
            --danger: #b42318;
            --danger-bg: #fef3f2;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                         BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #111827;
            color: white;
            padding: 26px 18px;
            display: flex;
            flex-direction: column;
            position: fixed;
            inset: 0 auto 0 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 12px;
            margin-bottom: 42px;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: var(--primary);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .nav a:hover,
        .nav a.active {
            color: white;
            background: var(--primary);
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .logout {
            width: 100%;
            border: 0;
            background: transparent;
            color: #cbd5e1;
            padding: 12px 14px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .logout:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 32px 42px 50px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 22px;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
        }

        .eyebrow {
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: -0.8px;
        }

        .description {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .track-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            margin-bottom: 24px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.03);
        }

        .track-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 21px 24px;
            border-bottom: 1px solid var(--border);
            background: #fff;
        }

        .track-title {
            margin: 0;
            font-size: 18px;
        }

        .track-code {
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            border: 0;
            cursor: pointer;
            font-family: inherit;
        }

        .generate-btn {
            padding: 10px 15px;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-size: 13px;
            font-weight: 700;
        }

        .generate-btn:hover {
            background: var(--primary-dark);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            color: #475467;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
        }

        th,
        td {
            text-align: left;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
        }

        td {
            font-size: 13px;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:hover {
            background: #fafcff;
        }

        .rank {
            font-weight: 800;
            color: var(--primary);
        }

        .average {
            display: inline-flex;
            padding: 6px 9px;
            border-radius: 8px;
            background: var(--success-bg);
            color: var(--success);
            font-weight: 800;
        }

        .empty {
            padding: 30px 24px;
            color: var(--muted);
            font-size: 14px;
        }

        #status {
            display: none;
            margin-bottom: 24px;
            padding: 12px 15px;
            border-radius: 10px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 13px;
        }

        #status.error {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .excel-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .excel-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 18px;
            border-radius: 11px;
            background: #172033;
            color: white;
            font-size: 14px;
            font-weight: 700;
        }

        .excel-btn:hover {
            background: #0f172a;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                inset: auto;
            }

            .layout {
                display: block;
            }

            .main {
                width: 100%;
                margin-left: 0;
                padding: 25px 18px;
            }

            .page-header,
            .track-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions {
                width: 100%;
            }

            .generate-btn {
                width: 100%;
            }

            .excel-container {
                justify-content: stretch;
            }

            .excel-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body th:attr="data-promotion-id=${promotionId}">

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🎓</div>
            <span>HEI Graduate</span>
        </div>

        <nav class="nav">
            <a href="/promotions" class="active">
                🎓 &nbsp; Promotions
            </a>
        </nav>

        <div class="sidebar-bottom">
            <button id="logout-btn" class="logout">
                ↪ &nbsp; Se déconnecter
            </button>
        </div>

    </aside>

    <main class="main">

        <a href="/promotions" class="back-link">
            ← Retour aux promotions
        </a>

        <div class="page-header">

            <div>
                <div class="eyebrow">DIPLÔMATION</div>

                <h1 id="promotion-title">
                    Diplômés
                </h1>

                <p class="description">
                    Consultez le classement des diplômés par parcours.
                </p>
            </div>

        </div>

        <p id="status"></p>

        <div id="tracks-container"></div>

    </main>

</div>

<script th:src="@{/js/auth.js}"></script>

<script>
    window.heiAuth.requireAuth();

    const promotionId =
        document.body.getAttribute("data-promotion-id");

    const isAdmin =
        window.heiAuth.isAdmin();

    document
        .getElementById("logout-btn")
        .addEventListener("click", function () {
            window.heiAuth.logout();
        });

    function setStatus(message, isError) {

        const el = document.getElementById("status");

        el.textContent = message || "";

        el.className = isError ? "error" : "";

        el.style.display =
            message ? "block" : "none";
    }

    function renderDiplomaTable(diplomas) {

        if (diplomas.length === 0) {

            const p = document.createElement("p");

            p.className = "empty";

            p.textContent =
                "Aucun diplômé généré pour ce parcours.";

            return p;
        }

        const wrapper =
            document.createElement("div");

        wrapper.className = "table-wrapper";

        const table =
            document.createElement("table");

        table.innerHTML =
            "<thead>" +
            "<tr>" +
            "<th>Rang</th>" +
            "<th>STD</th>" +
            "<th>Nom</th>" +
            "<th>Prénom</th>" +
            "<th>Moyenne générale</th>" +
            "</tr>" +
            "</thead>" +
            "<tbody></tbody>";

        const body =
            table.querySelector("tbody");

        diplomas.forEach(function (d) {

            const row =
                document.createElement("tr");

            row.innerHTML =
                "<td><span class='rank'>" +
                (d.rank != null ? d.rank : "-") +
                "</span></td>" +

                "<td>" +
                d.studentNumber +
                "</td>" +

                "<td><strong>" +
                d.lastName +
                "</strong></td>" +

                "<td>" +
                d.firstName +
                "</td>" +

                "<td>" +
                "<span class='average'>" +
                (
                    d.overallAverage != null
                        ? Number(d.overallAverage).toFixed(2)
                        : "-"
                ) +
                "</span>" +
                "</td>";

            body.appendChild(row);
        });

        wrapper.appendChild(table);

        return wrapper;
    }

    async function loadRanking(parcours, container) {

        const response =
            await window.heiAuth.authFetch(
                "/api/promotions/" +
                promotionId +
                "/parcours/" +
                parcours.id +
                "/diplomas"
            );

        const diplomas =
            await response.json();

        container.appendChild(
            renderDiplomaTable(diplomas)
        );
    }

    async function generateRanking(parcours, container) {

        setStatus(
            "Génération du classement pour " +
            parcours.label +
            "..."
        );

        try {

            const response =
                await window.heiAuth.authFetch(
                    "/api/promotions/" +
                    promotionId +
                    "/parcours/" +
                    parcours.id +
                    "/diplomas/generate",
                    {
                        method: "POST"
                    }
                );

            if (!response.ok) {

                setStatus(
                    "Impossible de générer le classement pour " +
                    parcours.label +
                    ".",
                    true
                );

                return;
            }

            container.innerHTML = "";

            await loadRanking(
                parcours,
                container
            );

            setStatus(
                "Classement généré pour " +
                parcours.label +
                "."
            );

        } catch (err) {

            setStatus(
                "Erreur lors de la génération du classement.",
                true
            );
        }
    }

    async function downloadExcel() {

        setStatus(
            "Récupération du fichier Excel..."
        );

        try {

            let response =
                await window.heiAuth.authFetch(
                    "/api/promotions/" +
                    promotionId +
                    "/diplomas/excel"
                );

            if (response.status === 404) {

                setStatus(
                    "Fichier non trouvé. Génération du fichier Excel..."
                );

                response =
                    await window.heiAuth.authFetch(
                        "/api/promotions/" +
                        promotionId +
                        "/diplomas/excel/generate",
                        {
                            method: "POST"
                        }
                    );
            }

            if (!response.ok) {

                setStatus(
                    "Impossible de télécharger le fichier Excel.",
                    true
                );

                return;
            }

            const data =
                await response.json();

            window.open(
                data.downloadUrl,
                "_blank"
            );

            setStatus(
                "Fichier Excel prêt pour le téléchargement."
            );

        } catch (err) {

            setStatus(
                "Erreur lors du téléchargement du fichier Excel.",
                true
            );
        }
    }

    function buildTrackSection(parcours) {

        const section =
            document.createElement("section");

        section.className = "track-section";

        const header =
            document.createElement("div");

        header.className = "track-header";

        const title =
            document.createElement("h2");

        title.className = "track-title";

        title.innerHTML =
            parcours.label +
            " <span class='track-code'>(" +
            parcours.code +
            ")</span>";

        header.appendChild(title);

        if (isAdmin) {

            const actions =
                document.createElement("div");

            actions.className = "actions";

            const generateBtn =
                document.createElement("button");

            generateBtn.className =
                "generate-btn";

            generateBtn.textContent =
                "Générer le classement";

            generateBtn.addEventListener(
                "click",
                function () {

                    tableHolder.innerHTML = "";

                    generateRanking(
                        parcours,
                        tableHolder
                    );
                }
            );

            actions.appendChild(generateBtn);

            header.appendChild(actions);
        }

        section.appendChild(header);

        const tableHolder =
            document.createElement("div");

        section.appendChild(tableHolder);

        loadRanking(
            parcours,
            tableHolder
        );

        return section;
    }

    async function loadPromotion() {

        const response =
            await window.heiAuth.authFetch(
                "/api/promotions/" +
                promotionId
            );

        const promotion =
            await response.json();

        document.getElementById(
            "promotion-title"
        ).textContent =
            "Diplômés — " +
            promotion.label;
    }

    async function loadTracks() {

        const container =
            document.getElementById(
                "tracks-container"
            );

        const response =
            await window.heiAuth.authFetch(
                "/api/parcours?activeOnly=true"
            );

        const tracks =
            await response.json();

        tracks.forEach(function (parcours) {

            container.appendChild(
                buildTrackSection(parcours)
            );
        });

        if (isAdmin) {

            const excelContainer =
                document.createElement("div");

            excelContainer.className =
                "excel-container";

            const excelBtn =
                document.createElement("button");

            excelBtn.className =
                "excel-btn";

            excelBtn.innerHTML =
                "📊 &nbsp; Télécharger la liste des diplômés (Excel)";

            excelBtn.addEventListener(
                "click",
                downloadExcel
            );

            excelContainer.appendChild(
                excelBtn
            );

            container.appendChild(
                excelContainer
            );
        }
    }

    loadPromotion();
    loadTracks();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEI Graduate — Mes notes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navy: #0b1f3f;
            --navy-dark: #061428;
            --navy-mid: #12294d;
            --gold: #c9a227;
            --gold-dark: #a9871c;
            --gold-light: #f4e8c1;
            --background: #f6f4ee;
            --surface: #ffffff;
            --text: #10192b;
            --muted: #647089;
            --border: #e4e1d5;
            --danger: #b42318;
            --danger-bg: #fef3f2;
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system,
                         BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, var(--navy-dark), var(--navy));
            color: white;
            padding: 26px 18px;
            display: flex;
            flex-direction: column;
            position: fixed;
            inset: 0 auto 0 0;
            border-right: 1px solid rgba(201, 162, 39, 0.2);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 12px;
            margin-bottom: 42px;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: var(--gold);
            color: var(--navy-dark);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav a {
            color: rgba(255, 255, 255, 0.72);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav a.active {
            color: var(--navy-dark);
            background: var(--gold);
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .logout {
            width: 100%;
            border: 0;
            background: transparent;
            color: rgba(255, 255, 255, 0.72);
            padding: 12px 14px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .logout:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 36px 42px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .eyebrow {
            color: var(--gold-dark);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.06em;
            margin-bottom: 7px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: -0.8px;
            color: var(--navy-dark);
        }

        .top-description {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(11, 31, 63, 0.05);
            overflow: hidden;
        }

        .card-header {
            padding: 22px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            margin: 0;
            font-size: 17px;
            color: var(--navy-dark);
        }

        .card-subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #fbf9f3;
            color: var(--navy);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
        }

        th,
        td {
            padding: 16px 24px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        td {
            font-size: 14px;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        tbody tr:hover {
            background: #fdfbf5;
        }

        .grade {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 66px;
            padding: 7px 10px;
            border-radius: 8px;
            background: var(--gold-light);
            color: var(--navy-dark);
            font-weight: 800;
        }

        .grade.low {
            background: var(--danger-bg);
            color: var(--danger);
        }

        #empty {
            padding: 48px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .empty-icon {
            font-size: 34px;
            margin-bottom: 10px;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                inset: auto;
            }

            .layout {
                display: block;
            }

            .brand {
                margin-bottom: 20px;
            }

            .nav {
                flex-direction: row;
            }

            .sidebar-bottom {
                margin-top: 15px;
            }

            .main {
                width: 100%;
                margin-left: 0;
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🎓</div>
            <span>HEI Graduate</span>
        </div>

        <nav class="nav">
            <!-- Rempli dynamiquement par heiAuth.renderSidebar -->
        </nav>

        <div class="sidebar-bottom">
            <button id="logout-btn" class="logout">
                ↪ &nbsp; Se déconnecter
            </button>
        </div>

    </aside>

    <main class="main">

        <div class="topbar">
            <div>
                <div class="eyebrow">ESPACE ÉTUDIANT</div>
                <h1>Mes notes</h1>
                <p class="top-description">
                    Consultez vos résultats académiques publiés.
                </p>
            </div>
        </div>

        <section class="card">

            <div class="card-header">
                <div>
                    <h2 class="card-title">Résultats académiques</h2>
                    <p class="card-subtitle">
                        Vos notes par cours et par examen
                    </p>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="grades-table" style="display:none;">
                    <thead>
                    <tr>
                        <th>Cours</th>
                        <th>Examen</th>
                        <th>Note</th>
                    </tr>
                    </thead>
                    <tbody id="grades-body"></tbody>
                </table>
            </div>

            <div id="empty" style="display:none;">
                <div class="empty-icon">📚</div>
                <div>Aucune note publiée pour le moment.</div>
            </div>

        </section>

    </main>

</div>

<script th:src="@{/js/auth.js}"></script>

<script>
    window.heiAuth.requireAuth();
    window.heiAuth.renderSidebar("notes");


    (function enforceRole() {
        if (window.heiAuth.isAdmin && window.heiAuth.isAdmin()) {
            window.location.href = "/promotions";
            return;
        }
        if (!(window.heiAuth.isStudent && window.heiAuth.isStudent())) {
            window.heiAuth.logout();
            window.location.href = "/login";
        }
    })();

    document.getElementById("logout-btn").addEventListener("click", function () {
        window.heiAuth.logout();
    });

    function renderRow(grade) {
        const row = document.createElement("tr");

        const value = Number(grade.value);

        const valueClass =
            value < 10
                ? "grade low"
                : "grade";

        row.innerHTML =
            "<td><strong>" + grade.courseReference + "</strong></td>" +
            "<td>" + grade.examLabel + "</td>" +
            "<td><span class='" + valueClass + "'>" +
            value.toFixed(2) +
            "</span></td>";

        return row;
    }

    async function loadMyGrades() {

        const response =
            await window.heiAuth.authFetch("/api/grades/me");

        if (!response.ok) {
            document.getElementById("empty").textContent =
                "Impossible de charger vos notes.";

            document.getElementById("empty").style.display = "block";
            return;
        }

        const grades = await response.json();

        if (grades.length === 0) {
            document.getElementById("empty").style.display = "block";
            return;
        }

        const body = document.getElementById("grades-body");

        grades.forEach(function (grade) {
            body.appendChild(renderRow(grade));
        });

        document.getElementById("grades-table").style.display = "table";
    }

    loadMyGrades();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HEI Graduate — Mes notes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navy: #071b36;
            --navy-light: #0d2a4f;
            --gold: #d4af37;
            --gold-light: #f8f1d7;
            --background: #f4f6f9;
            --surface: #ffffff;
            --text: #10233f;
            --muted: #667085;
            --border: #e4e7ec;
            --danger: #b42318;
            --danger-bg: #fef3f2;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui,
                         -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: var(--navy);
            color: white;
            padding: 26px 18px;
            display: flex;
            flex-direction: column;
            position: fixed;
            inset: 0 auto 0 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 12px;
            margin-bottom: 42px;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: var(--gold);
            color: var(--navy);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            color: #d8e0ea;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--navy);
            background: var(--gold);
        }

        .nav-icon {
            width: 20px;
            text-align: center;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .logout {
            width: 100%;
            border: 1px solid rgba(255,255,255,.12);
            background: transparent;
            color: #d8e0ea;
            padding: 12px 14px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .logout:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 42px;
        }

        .topbar {
            margin-bottom: 30px;
        }

        .eyebrow {
            color: #a17e12;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .1em;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .top-description {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(7,27,54,.05);
            overflow: hidden;
        }

        .card-header {
            padding: 22px 24px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            margin: 0;
            font-size: 17px;
        }

        .card-subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 16px 24px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #fafbfc;
            color: #59677a;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .04em;
            font-weight: 700;
        }

        td {
            font-size: 14px;
        }

        tbody tr:hover {
            background: #fcfcfa;
        }

        .grade {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 66px;
            padding: 7px 10px;
            border-radius: 8px;
            background: #edf8f1;
            color: #167044;
            font-weight: 800;
        }

        .grade.low {
            background: var(--danger-bg);
            color: var(--danger);
        }

        #empty {
            padding: 48px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .empty-icon {
            font-size: 34px;
            margin-bottom: 10px;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 100%;
                position: relative;
            }

            .layout {
                display: block;
            }

            .main {
                width: 100%;
                margin-left: 0;
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🎓</div>
            <span>HEI Graduate</span>
        </div>

        <nav class="nav"></nav>

        <div class="sidebar-bottom">
            <button id="logout-btn" class="logout">
                ↪ &nbsp; Se déconnecter
            </button>
        </div>

    </aside>

    <main class="main">

        <div class="topbar">

            <div class="eyebrow">
                ESPACE ÉTUDIANT
            </div>

            <h1>Mes notes</h1>

            <p class="top-description">
                Consultez vos résultats académiques publiés.
            </p>

        </div>

        <section class="card">

            <div class="card-header">

                <h2 class="card-title">
                    Résultats académiques
                </h2>

                <p class="card-subtitle">
                    Vos notes par cours et par examen
                </p>

            </div>

            <div class="table-wrapper">

                <table id="grades-table" style="display:none;">

                    <thead>
                    <tr>
                        <th>Cours</th>
                        <th>Examen</th>
                        <th>Note</th>
                    </tr>
                    </thead>

                    <tbody id="grades-body"></tbody>

                </table>

            </div>

            <div id="empty" style="display:none;">

                <div class="empty-icon">📚</div>

                <div>
                    Aucune note publiée pour le moment.
                </div>

            </div>

        </section>

    </main>

</div>

<script th:src="@{/js/auth.js}"></script>

<script>

    window.heiAuth.requireAuth();

    /*
     * Cette page appartient uniquement à STUDENT.
     */
    if (!window.heiAuth.isStudent()) {

        if (window.heiAuth.isAdmin()) {
            window.location.href = "/promotions";
        } else {
            window.location.href = "/login";
        }

    } else {

        window.heiAuth.renderSidebar("notes");

        /*
         * Navigation propre pour STUDENT.
         * Plus aucun caractère encodé/cassé.
         */
        document.querySelector(".nav").innerHTML = `
            <a href="/notes" class="active">
                <span class="nav-icon">▤</span>
                <span>Notes</span>
            </a>

            <a href="/releves">
                <span class="nav-icon">▥</span>
                <span>Relevés</span>
            </a>
        `;
    }

    document
        .getElementById("logout-btn")
        .addEventListener(
            "click",
            function () {
                window.heiAuth.logout();
            }
        );

    function renderRow(grade) {

        const row =
            document.createElement("tr");

        const value =
            Number(grade.value);

        const valueClass =
            value < 10
                ? "grade low"
                : "grade";

        row.innerHTML =

            "<td><strong>" +
                grade.courseReference +
            "</strong></td>" +

            "<td>" +
                grade.examLabel +
            "</td>" +

            "<td>" +
                "<span class='" +
                    valueClass +
                "'>" +
                    value.toFixed(2) +
                "</span>" +
            "</td>";

        return row;
    }

    async function loadMyGrades() {

        const response =
            await window.heiAuth.authFetch(
                "/api/grades/me"
            );

        if (!response.ok) {

            document.getElementById("empty")
                .textContent =
                "Impossible de charger vos notes.";

            document.getElementById("empty")
                .style.display = "block";

            return;
        }

        const grades =
            await response.json();

        if (grades.length === 0) {

            document.getElementById("empty")
                .style.display = "block";

            return;
        }

        const body =
            document.getElementById(
                "grades-body"
            );

        grades.forEach(function (grade) {

            body.appendChild(
                renderRow(grade)
            );
        });

        document.getElementById(
            "grades-table"
        ).style.display = "table";
    }

    if (window.heiAuth.isStudent()) {
        loadMyGrades();
    }

</script>

</body>
</html>

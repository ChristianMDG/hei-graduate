<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HEI Graduate — Mes notes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navy: #071a33;
            --navy-light: #0d2a4d;
            --gold: #c9a227;
            --gold-soft: #f8f1d8;
            --background: #f5f7fa;
            --surface: #ffffff;
            --text: #132238;
            --muted: #667085;
            --border: #e2e7ee;
            --danger: #b42318;
            --danger-bg: #fef3f2;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: var(--navy);
            color: white;
            padding: 26px 18px;
            display: flex;
            flex-direction: column;
            position: fixed;
            inset: 0 auto 0 0;
            box-shadow: 8px 0 30px rgba(7,26,51,.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 12px;
            margin-bottom: 42px;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-icon {
            width: 39px;
            height: 39px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: var(--gold);
            color: var(--navy);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 650;
            transition: .2s;
        }

        .nav a:hover {
            background: rgba(255,255,255,.07);
            color: white;
        }

        .nav a.active {
            background: var(--gold);
            color: var(--navy);
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .logout {
            width: 100%;
            border: 1px solid rgba(255,255,255,.08);
            background: transparent;
            color: #cbd5e1;
            padding: 12px 14px;
            text-align: left;
            border-radius: 11px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 650;
        }

        .logout:hover {
            background: rgba(255,255,255,.07);
            color: white;
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 40px 42px;
        }

        .topbar {
            margin-bottom: 30px;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .14em;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            color: var(--navy);
            letter-spacing: -.7px;
        }

        .top-description {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 19px;
            box-shadow: 0 8px 28px rgba(7,26,51,.045);
            overflow: hidden;
        }

        .card-header {
            padding: 22px 24px;
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            margin: 0;
            font-size: 17px;
            color: var(--navy);
        }

        .card-subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #fafbfc;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .05em;
            font-weight: 750;
        }

        th,
        td {
            padding: 16px 24px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        td {
            font-size: 14px;
        }

        tbody tr:hover {
            background: #fcfaf2;
        }

        tbody tr:last-child td {
            border-bottom: 0;
        }

        .grade {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 66px;
            padding: 7px 11px;
            border-radius: 9px;
            background: var(--gold-soft);
            color: #765e08;
            font-weight: 850;
        }

        .grade.low {
            background: var(--danger-bg);
            color: var(--danger);
        }

        #empty {
            padding: 48px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .empty-icon {
            font-size: 34px;
            margin-bottom: 10px;
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                inset: auto;
            }

            .layout {
                display: block;
            }

            .main {
                width: 100%;
                margin-left: 0;
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🎓</div>
            <span>HEI Graduate</span>
        </div>

        <nav class="nav">
        </nav>

        <div class="sidebar-bottom">
            <button id="logout-btn" class="logout">
                ↪ &nbsp; Se déconnecter
            </button>
        </div>

    </aside>

    <main class="main">

        <div class="topbar">

            <div class="eyebrow">
                ESPACE ÉTUDIANT
            </div>

            <h1>Mes notes</h1>

            <p class="top-description">
                Consultez vos résultats académiques publiés.
            </p>

        </div>

        <section class="card">

            <div class="card-header">

                <h2 class="card-title">
                    Résultats académiques
                </h2>

                <p class="card-subtitle">
                    Vos notes par cours et par examen
                </p>

            </div>

            <div class="table-wrapper">

                <table id="grades-table" style="display:none;">

                    <thead>
                    <tr>
                        <th>Cours</th>
                        <th>Examen</th>
                        <th>Note</th>
                    </tr>
                    </thead>

                    <tbody id="grades-body"></tbody>

                </table>

            </div>

            <div id="empty" style="display:none;">

                <div class="empty-icon">📚</div>

                <div>
                    Aucune note publiée pour le moment.
                </div>

            </div>

        </section>

    </main>

</div>

<script th:src="@{/js/auth.js}"></script>

<script>

    window.heiAuth.requireAuth();

    if (!window.heiAuth.isStudent || !window.heiAuth.isStudent()) {

        if (window.heiAuth.logout) {
            window.heiAuth.logout();
        } else {
            window.location.href = "/login";
        }
    }

    window.heiAuth.renderSidebar("notes");

    document
        .getElementById("logout-btn")
        .addEventListener("click", function () {
            window.heiAuth.logout();
        });

    function renderRow(grade) {

        const row =
            document.createElement("tr");

        const value =
            Number(grade.value);

        const valueClass =
            value < 10
                ? "grade low"
                : "grade";

        row.innerHTML =
            "<td><strong>" +
                grade.courseReference +
            "</strong></td>" +

            "<td>" +
                grade.examLabel +
            "</td>" +

            "<td><span class='" +
                valueClass +
                "'>" +
                value.toFixed(2) +
            "</span></td>";

        return row;
    }

    async function loadMyGrades() {

        try {

            const response =
                await window.heiAuth.authFetch(
                    "/api/grades/me"
                );

            if (!response.ok) {

                document.getElementById("empty")
                    .innerHTML =
                    "<div class='empty-icon'>⚠️</div>" +
                    "<div>Impossible de charger vos notes.</div>";

                document.getElementById("empty")
                    .style.display = "block";

                return;
            }

            const grades =
                await response.json();

            if (grades.length === 0) {

                document.getElementById("empty")
                    .style.display = "block";

                return;
            }

            const body =
                document.getElementById(
                    "grades-body"
                );

            grades.forEach(function (grade) {

                body.appendChild(
                    renderRow(grade)
                );

            });

            document.getElementById(
                "grades-table"
            ).style.display = "table";

        } catch (err) {

            document.getElementById("empty")
                .innerHTML =
                "<div class='empty-icon'>⚠️</div>" +
                "<div>Impossible de charger vos notes.</div>";

            document.getElementById("empty")
                .style.display = "block";
        }
    }

    loadMyGrades();

</script>

</body>
</html>

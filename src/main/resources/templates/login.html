<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEI Graduate — Connexion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navy: #0b1f3f;
            --navy-dark: #061428;
            --navy-mid: #12294d;
            --gold: #c9a227;
            --gold-dark: #a9871c;
            --gold-light: #f4e8c1;
            --background: #f6f4ee;
            --surface: #ffffff;
            --text: #10192b;
            --muted: #647089;
            --border: #e4e1d5;
            --danger: #b42318;
            --shadow: 0 24px 60px rgba(6, 20, 40, 0.18);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Fraunces", Georgia, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(201, 162, 39, 0.14), transparent 40%),
                var(--background);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 1050px;
            min-height: 620px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--surface);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid rgba(201, 162, 39, 0.25);
        }

        .brand-panel {
            padding: 64px;
            background:
                linear-gradient(160deg, var(--navy-dark), var(--navy) 55%, var(--navy-mid) 100%);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .brand-panel::after {
            content: "";
            position: absolute;
            right: -80px;
            bottom: -80px;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 1px solid rgba(201, 162, 39, 0.35);
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            right: -30px;
            bottom: -30px;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 1px solid rgba(201, 162, 39, 0.25);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 22px;
            font-family: ui-sans-serif, system-ui, sans-serif;
            z-index: 1;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            background: var(--gold);
            color: var(--navy-dark);
            font-size: 20px;
        }

        .brand-content {
            max-width: 420px;
            z-index: 1;
        }

        .brand-content h1 {
            margin: 0 0 20px;
            font-size: 42px;
            line-height: 1.15;
            letter-spacing: -1px;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        .brand-content span.accent {
            color: var(--gold);
        }

        .brand-content p {
            margin: 0;
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.7;
            font-size: 16px;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        .brand-footer {
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            z-index: 1;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        .form-panel {
            padding: 64px;
            display: flex;
            align-items: center;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        .form-container {
            width: 100%;
            max-width: 390px;
            margin: auto;
        }

        .form-container h2 {
            margin: 0 0 8px;
            font-size: 30px;
            letter-spacing: -0.7px;
            color: var(--navy-dark);
        }

        .subtitle {
            margin: 0 0 34px;
            color: var(--muted);
            font-size: 15px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--navy-dark);
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0 15px;
            font-size: 15px;
            color: var(--text);
            outline: none;
            background: #fff;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201, 162, 39, 0.16);
        }

        button {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 12px;
            background: var(--gold);
            color: var(--navy-dark);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.2px;
        }

        button:hover {
            background: var(--gold-dark);
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.7;
            transform: none;
            cursor: default;
        }

        #error {
            min-height: 20px;
            margin: 14px 0 0;
            color: var(--danger);
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .login-wrapper {
                grid-template-columns: 1fr;
            }

            .brand-panel {
                padding: 40px;
                min-height: 280px;
            }

            .brand-content h1 {
                font-size: 32px;
            }

            .brand-footer {
                display: none;
            }

            .form-panel {
                padding: 40px 28px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <section class="brand-panel">
        <div class="brand">
            <div class="brand-icon">🎓</div>
            <span>HEI Graduate</span>
        </div>

        <div class="brand-content">
            <h1>Votre parcours académique, <span class="accent">simplement</span>.</h1>
            <p>
                Consultez vos notes, téléchargez vos relevés
                et accédez aux informations relatives aux promotions
                et aux diplômés.
            </p>
        </div>

        <div class="brand-footer">
            Plateforme de gestion académique — HEI Graduate
        </div>
    </section>

    <section class="form-panel">
        <div class="form-container">

            <h2>Bienvenue 👋</h2>
            <p class="subtitle">
                Connectez-vous à votre espace.
            </p>

            <form id="login-form">

                <div class="field">
                    <label for="email">Adresse e-mail</label>
                    <input
                            type="email"
                            id="email"
                            placeholder="exemple@email.com"
                            autocomplete="email"
                            required
                    >
                </div>

                <div class="field">
                    <label for="password">Mot de passe</label>
                    <input
                            type="password"
                            id="password"
                            placeholder="Votre mot de passe"
                            autocomplete="current-password"
                            required
                    >
                </div>

                <button type="submit">
                    Se connecter
                </button>

                <p id="error"></p>

            </form>
        </div>
    </section>

</div>

<script th:src="@{/js/auth.js}"></script>

<script>
    document.getElementById("login-form").addEventListener("submit", async function (e) {
        e.preventDefault();

        const error = document.getElementById("error");
        const button = this.querySelector("button");

        error.textContent = "";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        button.disabled = true;
        button.textContent = "Connexion...";

        try {
            const response = await fetch("/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            if (!response.ok) {
                error.textContent = "Identifiants invalides.";
                return;
            }

            const data = await response.json();
            const role = data.user.role;

            // Seuls ADMIN et STUDENT ont accès direct à la plateforme.
            if (role !== "STUDENT" && role !== "ADMIN") {
                error.textContent = "Votre rôle n'a pas accès direct à cette plateforme.";
                return;
            }

            window.heiAuth.setSession(data.token, data.user);

            window.location.href =
                role === "STUDENT"
                    ? "/notes"
                    : "/promotions";

        } catch (err) {
            error.textContent = "Erreur de connexion au serveur.";
        } finally {
            button.disabled = false;
            button.textContent = "Se connecter";
        }
    });
</script>

</body>
</html>

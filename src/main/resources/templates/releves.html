<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEI Graduate — Mes relevés</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navy: #0b1f3f;
            --navy-dark: #061428;
            --navy-mid: #12294d;
            --gold: #c9a227;
            --gold-dark: #a9871c;
            --gold-light: #f4e8c1;
            --background: #f6f4ee;
            --surface: #ffffff;
            --text: #10192b;
            --muted: #647089;
            --border: #e4e1d5;
            --danger: #b42318;
            --success: #027a48;
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system,
                         BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, var(--navy-dark), var(--navy));
            color: white;
            padding: 26px 18px;
            display: flex;
            flex-direction: column;
            position: fixed;
            inset: 0 auto 0 0;
            border-right: 1px solid rgba(201, 162, 39, 0.2);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 12px;
            margin-bottom: 42px;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: var(--gold);
            color: var(--navy-dark);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav a {
            color: rgba(255, 255, 255, 0.72);
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .nav a:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav a.active {
            color: var(--navy-dark);
            background: var(--gold);
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .logout {
            width: 100%;
            border: 0;
            background: transparent;
            color: rgba(255, 255, 255, 0.72);
            padding: 12px 14px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .logout:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 36px 42px;
        }

        .eyebrow {
            color: var(--gold-dark);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.06em;
            margin-bottom: 7px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: -0.8px;
            color: var(--navy-dark);
        }

        .description {
            color: var(--muted);
            margin: 8px 0 30px;
            font-size: 14px;
        }

        .transcript-card {
            max-width: 760px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 5px 20px rgba(11, 31, 63, 0.05);
        }

        .document-icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: var(--gold-light);
            color: var(--navy-dark);
            font-size: 27px;
            margin-bottom: 20px;
        }

        .card-title {
            margin: 0 0 8px;
            font-size: 20px;
            color: var(--navy-dark);
        }

        .card-description {
            color: var(--muted);
            margin: 0 0 28px;
            line-height: 1.6;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--navy-dark);
        }

        select {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: white;
            font-size: 14px;
            color: var(--text);
            outline: none;
        }

        select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201, 162, 39, 0.16);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button.action {
            min-height: 48px;
            padding: 0 20px;
            border-radius: 11px;
            border: 1px solid var(--gold);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        #download-btn {
            background: var(--gold);
            color: var(--navy-dark);
        }

        #download-btn:hover {
            background: var(--gold-dark);
        }

        #email-btn {
            background: white;
            color: var(--navy);
            border-color: var(--navy);
        }

        #email-btn:hover {
            background: var(--gold-light);
        }

        #status {
            margin: 20px 0 0;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fbf9f3;
            color: var(--muted);
            font-size: 13px;
            min-height: 18px;
        }

        #status.error {
            background: #fef3f2;
            color: var(--danger);
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                inset: auto;
            }

            .layout {
                display: block;
            }

            .main {
                width: 100%;
                margin-left: 0;
                padding: 25px 18px;
            }

            .actions {
                flex-direction: column;
            }

            button.action {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🎓</div>
            <span>HEI Graduate</span>
        </div>

        <nav class="nav">
            <!-- Rempli dynamiquement par heiAuth.renderSidebar -->
        </nav>

        <div class="sidebar-bottom">
            <button id="logout-btn" class="logout">
                ↪ &nbsp; Se déconnecter
            </button>
        </div>

    </aside>

    <main class="main">

        <div class="eyebrow">ESPACE ÉTUDIANT</div>

        <h1>Mes relevés de notes</h1>

        <p class="description">
            Téléchargez votre relevé ou demandez son envoi par e-mail.
        </p>

        <section class="transcript-card">

            <div class="document-icon">📄</div>

            <h2 class="card-title">
                Générer un relevé
            </h2>

            <p class="card-description">
                Sélectionnez une année universitaire afin de générer
                votre relevé de notes correspondant.
            </p>

            <label for="academic-year-select">
                Année universitaire
            </label>

            <select id="academic-year-select">
                <option value="">Sélectionnez une année</option>
            </select>

            <div class="actions">
                <button id="download-btn" class="action">
                    ↓ &nbsp; Télécharger le PDF
                </button>

                <button id="email-btn" class="action">
                    ✉ &nbsp; Recevoir par e-mail
                </button>
            </div>

            <p id="status"></p>

        </section>

    </main>

</div>

<script th:src="@{/js/auth.js}"></script>

<script>
    window.heiAuth.requireAuth();
    window.heiAuth.renderSidebar("releves");

    // Accès direct réservé aux étudiants. L'admin est renvoyé vers son
    // espace, tout autre rôle (ex. enseignant) est déconnecté.
    (function enforceRole() {
        if (window.heiAuth.isAdmin && window.heiAuth.isAdmin()) {
            window.location.href = "/promotions";
            return;
        }
        if (!(window.heiAuth.isStudent && window.heiAuth.isStudent())) {
            window.heiAuth.logout();
            window.location.href = "/login";
        }
    })();

    document.getElementById("logout-btn").addEventListener("click", function () {
        window.heiAuth.logout();
    });

    function setStatus(message, isError) {
        const el = document.getElementById("status");

        el.textContent = message || "";

        el.className = isError ? "error" : "";
    }

    function selectedAcademicYearId() {
        return document.getElementById("academic-year-select").value;
    }

    async function loadAcademicYears() {

        const response =
            await window.heiAuth.authFetch("/api/academic-years");

        const years = await response.json();

        const select =
            document.getElementById("academic-year-select");

        years.forEach(function (year) {

            const option = document.createElement("option");

            option.value = year.id;
            option.textContent = year.label;

            select.appendChild(option);
        });
    }

    async function downloadTranscript() {

        const academicYearId = selectedAcademicYearId();

        if (!academicYearId) {
            setStatus(
                "Sélectionnez une année universitaire.",
                true
            );
            return;
        }

        setStatus("Génération du relevé en cours...");

        try {

            const response =
                await window.heiAuth.authFetch(
                    "/api/transcripts/me?academicYearId=" +
                    academicYearId
                );

            if (!response.ok) {
                setStatus(
                    "Impossible de générer le relevé.",
                    true
                );
                return;
            }

            const blob = await response.blob();

            const url = window.URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = "mon-releve.pdf";

            document.body.appendChild(link);

            link.click();

            link.remove();

            window.URL.revokeObjectURL(url);

            setStatus("Relevé téléchargé.");

        } catch (err) {

            setStatus(
                "Erreur lors du téléchargement du relevé.",
                true
            );
        }
    }

    async function emailTranscript() {

        const academicYearId = selectedAcademicYearId();

        if (!academicYearId) {
            setStatus(
                "Sélectionnez une année universitaire.",
                true
            );
            return;
        }

        setStatus("Envoi du relevé par e-mail...");

        try {

            const response =
                await window.heiAuth.authFetch(
                    "/api/transcripts/me/send-email?academicYearId=" +
                    academicYearId,
                    {
                        method: "POST"
                    }
                );

            if (!response.ok) {
                setStatus(
                    "Impossible d'envoyer le relevé par e-mail.",
                    true
                );
                return;
            }

            setStatus(
                "Envoi en cours — vous recevrez votre relevé par e-mail sous peu."
            );

        } catch (err) {

            setStatus(
                "Erreur lors de l'envoi du relevé par e-mail.",
                true
            );
        }
    }

    document
        .getElementById("download-btn")
        .addEventListener("click", downloadTranscript);

    document
        .getElementById("email-btn")
        .addEventListener("click", emailTranscript);

    loadAcademicYears();
</script>

</body>
</html>

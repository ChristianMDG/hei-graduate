<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HEI Graduate — Mes relevés</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --navy: #071b36;
            --navy-light: #0d2a4f;
            --gold: #d4af37;
            --gold-light: #f8f1d7;
            --background: #f4f6f9;
            --surface: #ffffff;
            --text: #10233f;
            --muted: #667085;
            --border: #e4e7ec;
            --danger: #b42318;
            --success: #027a48;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui,
                         -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            background: var(--background);
            color: var(--text);
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: var(--navy);
            color: white;
            padding: 26px 18px;
            display: flex;
            flex-direction: column;
            position: fixed;
            inset: 0 auto 0 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 12px;
            margin-bottom: 42px;
            font-size: 19px;
            font-weight: 800;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: var(--gold);
            color: var(--navy);
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav a {
            display: flex;
            align-items: center;
            gap: 11px;
            color: #d8e0ea;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--navy);
            background: var(--gold);
        }

        .nav-icon {
            width: 20px;
            text-align: center;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .logout {
            width: 100%;
            border: 1px solid rgba(255,255,255,.12);
            background: transparent;
            color: #d8e0ea;
            padding: 12px 14px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .logout:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
            padding: 42px;
        }

        .eyebrow {
            color: #a17e12;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .1em;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
        }

        .description {
            color: var(--muted);
            margin: 8px 0 30px;
            font-size: 14px;
        }

        .transcript-card {
            max-width: 760px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(7,27,54,.05);
        }

        .document-icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: var(--gold-light);
            color: var(--navy);
            font-size: 27px;
            margin-bottom: 20px;
        }

        .card-title {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .card-description {
            color: var(--muted);
            margin: 0 0 28px;
            line-height: 1.6;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        select {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: white;
            font-size: 14px;
            color: var(--text);
            outline: none;
        }

        select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(212,175,55,.12);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        button.action {
            min-height: 48px;
            padding: 0 20px;
            border-radius: 11px;
            border: 1px solid var(--gold);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        #download-btn {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
        }

        #download-btn:hover {
            background: var(--navy-light);
        }

        #email-btn {
            background: var(--gold-light);
            color: #70570b;
        }

        #email-btn:hover {
            background: var(--gold);
            color: var(--navy);
        }

        #status {
            margin: 20px 0 0;
            padding: 12px 14px;
            border-radius: 10px;
            background: #f8fafc;
            color: var(--muted);
            font-size: 13px;
            min-height: 18px;
        }

        #status.error {
            background: #fef3f2;
            color: var(--danger);
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                inset: auto;
            }

            .layout {
                display: block;
            }

            .main {
                width: 100%;
                margin-left: 0;
                padding: 25px 18px;
            }

            .actions {
                flex-direction: column;
            }

            button.action {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🎓</div>
            <span>HEI Graduate</span>
        </div>

        <nav class="nav"></nav>

        <div class="sidebar-bottom">
            <button id="logout-btn" class="logout">
                ↪ &nbsp; Se déconnecter
            </button>
        </div>

    </aside>

    <main class="main">

        <div class="eyebrow">
            ESPACE ÉTUDIANT
        </div>

        <h1>
            Mes relevés de notes
        </h1>

        <p class="description">
            Téléchargez votre relevé ou demandez son envoi par e-mail.
        </p>

        <section class="transcript-card">

            <div class="document-icon">
                📄
            </div>

            <h2 class="card-title">
                Générer un relevé
            </h2>

            <p class="card-description">
                Sélectionnez une année universitaire afin de générer
                votre relevé de notes correspondant.
            </p>

            <label for="academic-year-select">
                Année universitaire
            </label>

            <select id="academic-year-select">
                <option value="">
                    Sélectionnez une année
                </option>
            </select>

            <div class="actions">

                <button id="download-btn" class="action">
                    ↓ &nbsp; Télécharger le PDF
                </button>

                <button id="email-btn" class="action">
                    ✉ &nbsp; Recevoir par e-mail
                </button>

            </div>

            <p id="status"></p>

        </section>

    </main>

</div>

<script th:src="@{/js/auth.js}"></script>

<script>

    window.heiAuth.requireAuth();

    /*
     * Cette page appartient uniquement à STUDENT.
     */
    if (!window.heiAuth.isStudent()) {

        if (window.heiAuth.isAdmin()) {
            window.location.href = "/promotions";
        } else {
            window.location.href = "/login";
        }

    } else {

        window.heiAuth.renderSidebar("releves");

        /*
         * Navigation propre :
         * aucune chaîne encodée ou icône cassée.
         */
        document.querySelector(".nav").innerHTML = `
            <a href="/notes">
                <span class="nav-icon">▤</span>
                <span>Notes</span>
            </a>

            <a href="/releves" class="active">
                <span class="nav-icon">▥</span>
                <span>Relevés</span>
            </a>
        `;
    }

    document
        .getElementById("logout-btn")
        .addEventListener(
            "click",
            function () {
                window.heiAuth.logout();
            }
        );

    function setStatus(message, isError) {

        const el =
            document.getElementById("status");

        el.textContent =
            message || "";

        el.className =
            isError ? "error" : "";
    }

    function selectedAcademicYearId() {

        return document
            .getElementById(
                "academic-year-select"
            )
            .value;
    }

    async function loadAcademicYears() {

        const response =
            await window.heiAuth.authFetch(
                "/api/academic-years"
            );

        if (!response.ok) {
            return;
        }

        const years =
            await response.json();

        const select =
            document.getElementById(
                "academic-year-select"
            );

        years.forEach(function (year) {

            const option =
                document.createElement("option");

            option.value =
                year.id;

            option.textContent =
                year.label;

            select.appendChild(option);
        });
    }

    async function downloadTranscript() {

        const academicYearId =
            selectedAcademicYearId();

        if (!academicYearId) {

            setStatus(
                "Sélectionnez une année universitaire.",
                true
            );

            return;
        }

        setStatus(
            "Génération du relevé en cours..."
        );

        try {

            const response =
                await window.heiAuth.authFetch(
                    "/api/transcripts/me?academicYearId=" +
                    academicYearId
                );

            if (!response.ok) {

                setStatus(
                    "Impossible de générer le relevé.",
                    true
                );

                return;
            }

            const blob =
                await response.blob();

            const url =
                window.URL.createObjectURL(blob);

            const link =
                document.createElement("a");

            link.href = url;

            link.download =
                "mon-releve.pdf";

            document.body.appendChild(link);

            link.click();

            link.remove();

            window.URL.revokeObjectURL(url);

            setStatus(
                "Relevé téléchargé."
            );

        } catch (err) {

            setStatus(
                "Erreur lors du téléchargement du relevé.",
                true
            );
        }
    }

    async function emailTranscript() {

        const academicYearId =
            selectedAcademicYearId();

        if (!academicYearId) {

            setStatus(
                "Sélectionnez une année universitaire.",
                true
            );

            return;
        }

        setStatus(
            "Envoi du relevé par e-mail..."
        );

        try {

            const response =
                await window.heiAuth.authFetch(
                    "/api/transcripts/me/send-email?academicYearId=" +
                    academicYearId,
                    {
                        method: "POST"
                    }
                );

            if (!response.ok) {

                setStatus(
                    "Impossible d'envoyer le relevé par e-mail.",
                    true
                );

                return;
            }

            setStatus(
                "Envoi en cours — vous recevrez votre relevé par e-mail sous peu."
            );

        } catch (err) {

            setStatus(
                "Erreur lors de l'envoi du relevé par e-mail.",
                true
            );
        }
    }

    document
        .getElementById("download-btn")
        .addEventListener(
            "click",
            downloadTranscript
        );

    document
        .getElementById("email-btn")
        .addEventListener(
            "click",
            emailTranscript
        );

    if (window.heiAuth.isStudent()) {
        loadAcademicYears();
    }

</script>

</body>
</html>

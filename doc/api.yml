            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/enrollments/{studentId}/at:
    get:
      tags: [Enrollment]
      summary: Get the enrollment active for a student on a given date (ADMIN or TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "403":
          $ref: "#/components/responses/Forbidden"


  /api/exams:
    get:
      tags: [Exam]
      summary: List all exams (ADMIN)
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Exam]
      summary: Create an exam (ADMIN)
      description: Verifies that the sum of exam coefficients for a course/semester does not exceed 1.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResponse"
        "400":
          description: Coefficient sum exceeds 1 or numerator > denominator
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/exams/{id}:
    get:
      tags: [Exam]
      summary: Get an exam by ID (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Exam]
      summary: Update an exam (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Exam]
      summary: Delete an exam (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204":
          description: Exam successfully deleted
        "403":
          $ref: "#/components/responses/Forbidden"


  /api/grades:
    get:
      tags: [Grade]
      summary: Get all grades (ADMIN)
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Grade]
      summary: Enter a grade (ADMIN or assigned TEACHER)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "403":
          description: Teacher is not assigned to this course
        "409":
          description: Grade already exists for this student and exam

  /api/grades/{id}:
    get:
      tags: [Grade]
      summary: Get a grade by ID (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Grade]
      summary: Update a grade with reason (ADMIN or assigned TEACHER)
      description: Preserves edit history in grade_history (§9). A single @Transactional method reads the old value, inserts history, then updates — never a direct update elsewhere.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeUpdateRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResponse"
    delete:
      tags: [Grade]
      summary: Delete a grade (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204":
          description: Grade successfully deleted
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/grades/student/{studentId}:
    get:
      tags: [Grade]
      summary: Get grades for a specific student (ADMIN or assigned TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeResponse"

  /api/grades/me:
    get:
      tags: [Grade]
      summary: Get authenticated student's own published grades (ADMIN or STUDENT)
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeResponse"

  /api/grades/{id}/publish:
    post:
      tags: [Grade]
      summary: Publish a grade (ADMIN only)
      description: Blocked if the sum of exam coefficients for the course/semester is not exactly equal to 1 (§7/§10).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "400":
          description: Coefficient sum != 1
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/grades/{id}/history:
    get:
      tags: [Grade]
      summary: Get grade modification history (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeHistoryResponse"

  /api/transcripts/{studentId}:
    get:
      tags: [Transcript]
      summary: Generate a PDF academic transcript for a student (ADMIN)
      description: Reads the student's mandatory courses for their current track (via CourseRequirementQuery) and their final grades (via FinalGradeQuery). Marked "provisoire" if any grade is missing.
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Binary PDF file of the transcript
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/transcripts/me:
    get:
      tags: [Transcript]
      summary: Download authenticated student's own PDF transcript (ADMIN or STUDENT)
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/transcripts/{studentId}/send-email:
    post:
      tags: [Transcript]
      summary: Request asynchronous email delivery of a student's transcript (ADMIN)
      description: >
        Publishes a TranscriptEmailRequested event. A Poja worker regenerates the PDF,
        uploads it to the S3 bucket, and emails the student a presigned download link
        (valid 7 days) — the HTTP request returns immediately without waiting on
        PDF generation, S3 I/O, or SMTP.
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Event accepted — email will be sent asynchronously
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/transcripts/me/send-email:
    post:
      tags: [Transcript]
      summary: Request asynchronous email delivery of the authenticated student's own transcript (ADMIN or STUDENT)
      security:
        - bearerAuth: []
      parameters:
        - name: academicYearId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Event accepted — email will be sent asynchronously
        "403":
          $ref: "#/components/responses/Forbidden"


  /api/promotions:
    post:
      tags: [Promotion]
      summary: Create a promotion / graduating class (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [Promotion]
      summary: List all promotions (any authenticated user)
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromotionResponse"

  /api/promotions/{id}:
    get:
      tags: [Promotion]
      summary: Get a promotion by ID (any authenticated user)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionResponse"
        "404":
          $ref: "#/components/responses/NotFound"


  /api/promotions/{promotionId}/parcours/{parcoursId}/diplomas/generate:
    post:
      tags: [Ranking & Graduation]
      summary: Generate ranking and determine graduate students (ADMIN)
      description: Determines graduates (overall average >= 10/20 on all mandatory courses over 3 years) and calculates rank.
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: parcoursId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiplomaResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/promotions/{promotionId}/parcours/{parcoursId}/diplomas:
    get:
      tags: [Ranking & Graduation]
      summary: Get graduates list and ranking for a track (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: parcoursId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiplomaResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/promotions/{promotionId}/diplomas/excel:
    get:
      tags: [DiplomaExcel]
      summary: Get pre-signed S3 download URL for an existing Excel file (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiplomaExcelResponse"
        "404":
          description: Excel file not generated yet
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/promotions/{promotionId}/diplomas/excel/generate:
    post:
      tags: [DiplomaExcel]
      summary: Generate graduates Excel file and persist link on S3 (ADMIN)
      description: One worksheet per track.
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiplomaExcelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request body or parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required or invalid token
    Forbidden:
      description: Access denied (Requires ADMIN or assigned TEACHER role)
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@hei.mg
        password:
          type: string
          example: password123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, TEACHER, STUDENT]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLogin:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
          enum: [ADMIN, TEACHER, STUDENT]

    UpdateUserRequest:
      type: object
      required: [email, role, active]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, TEACHER, STUDENT]
        active:
          type: boolean

    StudentRequest:
      type: object
      required: [userId, studentNumber, lastName, firstName, enrollmentDate, status]
      properties:
        userId:
          type: string
          format: uuid
        studentNumber:
          type: string
          example: STD24049
        lastName:
          type: string
        firstName:
          type: string
        birthDate:
          type: string
          format: date
        enrollmentDate:
          type: string
          format: date
        status:
          type: string

    StudentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        studentNumber:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        birthDate:
          type: string
          format: date
        enrollmentDate:
          type: string
          format: date
        status:
          type: string

    TeacherRequest:
      type: object
      required: [userId, lastName, firstName]
      properties:
        userId:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        specialty:
          type: string
        contractType:
          type: string

    TeacherResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string
        specialty:
          type: string
        contractType:
          type: string

    CourseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseReference:
          type: string
          example: PROG4
        title:
          type: string
          example: Advanced Programming
        credits:
          type: integer
          example: 5
        active:
          type: boolean

    CourseRequest:
      type: object
      required: [courseReference, title, credits]
      properties:
        courseReference:
          type: string
        title:
          type: string
        credits:
          type: integer
          minimum: 1
          maximum: 30

    ParcoursResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: EL
        label:
          type: string
          example: Software Ecosystem
        active:
          type: boolean

    ParcoursRequest:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          maxLength: 10
        label:
          type: string

    GroupRequest:
      type: object
      required: [reference]
      properties:
        reference:
          type: string
          example: K1
        capacity:
          type: integer
          minimum: 1

    GroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        capacity:
          type: integer
        active:
          type: boolean

    AcademicYearRequest:
      type: object
      required: [label, startDate, endDate, level]
      properties:
        label:
          type: string
          example: "2025-2026"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        level:
          type: string
          example: L1

    AcademicYearResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        level:
          type: string

    SemesterRequest:
      type: object
      required: [academicYearId, label, startDate, endDate]
      properties:
        academicYearId:
          type: string
          format: uuid
        label:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        expectedCredits:
          type: integer
          minimum: 1
          example: 30

    SemesterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        academicYearId:
          type: string
          format: uuid
        label:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        expectedCredits:
          type: integer
        active:
          type: boolean

    CourseTrackRequest:
      type: object
      required: [courseId, trackId, semesterId, mandatory]
      properties:
        courseId:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        mandatory:
          type: boolean

    CourseTrackResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        courseReference:
          type: string
        trackId:
          type: string
          format: uuid
        trackCode:
          type: string
        semesterId:
          type: string
          format: uuid
        semesterLabel:
          type: string
        academicYearId:
          type: string
          format: uuid
        mandatory:
          type: boolean

    AssignmentRequest:
      type: object
      required: [courseId, teacherId, academicYearId, groupIds]
      properties:
        courseId:
          type: string
          format: uuid
        teacherId:
          type: string
          format: uuid
        academicYearId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        groupIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    AssignmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        courseReference:
          type: string
        teacherId:
          type: string
          format: uuid
        teacherLastName:
          type: string
        academicYearId:
          type: string
          format: uuid
        academicYearLabel:
          type: string
        semesterId:
          type: string
          format: uuid
        semesterLabel:
          type: string
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              reference:
                type: string

    EnrollmentRequest:
      type: object
      required: [studentId, parcoursId, groupId, startDate]
      properties:
        studentId:
          type: string
          format: uuid
        parcoursId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date

    EnrollmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        parcoursId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    TransferRequest:
      type: object
      required: [effectiveDate]
      description: At least one of parcoursId / groupId should be set — a transfer that changes neither is a no-op.
      properties:
        parcoursId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date

    ExamResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        courseReference:
          type: string
        academicYearId:
          type: string
          format: uuid
        academicYearLabel:
          type: string
        semesterId:
          type: string
          format: uuid
        semesterLabel:
          type: string
        label:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          example: "08:00:00"
        endTime:
          type: string
          example: "10:00:00"
        coefficientNumerator:
          type: integer
          example: 1
        coefficientDenominator:
          type: integer
          example: 2

    ExamRequest:
      type: object
      required:
        [
          courseId,
          academicYearId,
          semesterId,
          label,
          date,
          startTime,
          endTime,
          coefficientNumerator,
          coefficientDenominator,
        ]
      properties:
        courseId:
          type: string
          format: uuid
        academicYearId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        label:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          example: "08:00:00"
        endTime:
          type: string
          example: "10:00:00"
        coefficientNumerator:
          type: integer
          minimum: 1
        coefficientDenominator:
          type: integer
          minimum: 1

    GradeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        studentLastName:
          type: string
        examId:
          type: string
          format: uuid

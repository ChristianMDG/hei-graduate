openapi: 3.0.3
info:
  title: HEI Graduate — Complete API Specification
  description: >
    Complete OpenAPI documentation for the HEI Graduate application.
    Manages students, teachers, courses, tracks (EL/TN), groups, assignments,
    exams, grades, modification history, PDF transcripts, graduate rankings, and S3 Excel exports.
  version: 1.1.0

servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Auth
    description: JWT Authentication (Login)
  - name: User
    description: User account management (ADMIN)
  - name: Student
    description: Student profile management
  - name: Teacher
    description: Teacher profile management
  - name: Course
    description: Course catalog management (ADMIN)
  - name: Parcours
    description: Track management (EL - Software Ecosystem, TN - Digital Transformation)
  - name: Group
    description: Student group management (K1, K2, K3) (ADMIN)
  - name: AcademicYear
    description: Academic year management (L1, L2, L3)
  - name: Semester
    description: Semester management (30 ECTS credits per semester) (ADMIN)
  - name: CourseTrack
    description: COURS_PARCOURS — mandatory/optional course-to-track-to-semester mapping (ADMIN)
  - name: Assignment
    description: Teacher assignments to courses, years, and groups (ADMIN)
  - name: Enrollment
    description: Student enrollments, track/group transfer history
  - name: Exam
    description: Exam management and coefficient sum validation (=1 per semester) (ADMIN)
  - name: Grade
    description: Grade entry, consultation, publication, and edit history
  - name: Transcript
    description: PDF transcript generation and asynchronous email delivery
  - name: Promotion
    description: Promotion (graduating class) management
  - name: Ranking & Graduation
    description: 3-year graduation determination and student ranking by promotion and track
  - name: DiplomaExcel
    description: Graduates Excel list export and saved S3 download URL retrieval

paths:

  /auth/login:
    post:
      tags: [Auth]
      summary: User authentication (JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful, returns JWT token and user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"


openapi: 3.0.3
info:
  title: HEI Graduate — Complete API Specification
  description: >
    Complete OpenAPI documentation for the HEI Graduate application.
    Manages students, teachers, courses, tracks (EL/TN), groups, assignments,
    exams, grades, modification history, PDF transcripts, graduate rankings, and S3 Excel exports.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Auth
    description: JWT Authentication (Login, Profile)
  - name: Student
    description: Student profile management
  - name: Teacher
    description: Teacher profile management
  - name: Course
    description: Course catalog management
  - name: Parcours
    description: Track management (EL - Software Ecosystem, TN - Digital Transformation)
  - name: Group
    description: Student group management (K1, K2, K3)
  - name: AcademicYear
    description: Academic year management (L1, L2, L3)
  - name: Semester
    description: Semester management (30 ECTS credits per semester)
  - name: Assignment
    description: Teacher assignments to courses, years, and groups
  - name: Enrollment
    description: Student enrollments, track/group transfer history
  - name: Exam
    description: Exam management and coefficient sum validation (=1 per semester)
  - name: Grade
    description: Grade entry, consultation, publication, and edit history
  - name: Transcript
    description: PDF transcript generation and asynchronous email delivery
  - name: Ranking & Graduation
    description: 3-year graduation determination and student ranking by promotion and track
  - name: DiplomaExcel
    description: Graduates Excel list export and saved S3 download URL retrieval

paths:
  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /api/auth/login:
    post:
      tags: [Auth]
      summary: User authentication (JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful, returns JWT token and user role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get currently authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==========================================
  # COURSES
  # ==========================================
  /api/courses:
    get:
      tags: [Course]
      summary: List all courses
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Course]
      summary: Create a new course (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/courses/{id}:
    get:
      tags: [Course]
      summary: Get a course by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Course]
      summary: Update a course (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    delete:
      tags: [Course]
      summary: Deactivate a course (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "204":
          description: Course successfully deactivated
        "403":
          $ref: "#/components/responses/Forbidden"

  # ==========================================
  # PARCOURS (TRACKS)
  # ==========================================
  /api/parcours:
    get:
      tags: [Parcours]
      summary: List all tracks (EL, TN, etc.)
      security:
        - bearerAuth: []
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParcoursResponse"

    post:
      tags: [Parcours]
      summary: Create a track (ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParcoursRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParcoursResponse"

  # ==========================================
  # EXAMS
  # ==========================================
  /api/exams:
    get:
      tags: [Exam]
      summary: List exams for a given course and/or semester
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: query
          schema:
            type: string
            format: uuid
        - name: semesterId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamResponse"

    post:
      tags: [Exam]
      summary: Create an exam (ADMIN)
      description: Verifies that the sum of exam coefficients for a course/semester does not exceed 1.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamResponse"
        "400":
          description: Coefficient sum exceeds 1 or numerator > denominator

  # ==========================================
  # GRADES
  # ==========================================
  /api/grades:
    get:
      tags: [Grade]
      summary: Get all grades (ADMIN)
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Grade]
      summary: Enter a grade (ADMIN or assigned TEACHER)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeRequest"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "403":
          description: Teacher is not assigned to this course
        "409":
          description: Grade already exists for this student and exam

  /api/grades/me:
    get:
      tags: [Grade]
      summary: Get authenticated student's published grades (STUDENT)
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeResponse"

  /api/grades/student/{studentId}:
    get:
      tags: [Grade]
      summary: Get grades for a specific student (ADMIN or assigned TEACHER)
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeResponse"

  /api/grades/{id}:
    put:
      tags: [Grade]
      summary: Update a grade with reason (ADMIN or assigned TEACHER)
      description: Preserves edit history in grade_history (§9).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeUpdateRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResponse"

  /api/grades/{id}/publish:
    post:
      tags: [Grade]
      summary: Publish a grade (ADMIN only)
      description: Blocked if the sum of exam coefficients for the course/semester is not exactly equal to 1 (§7/§10).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResponse"
        "400":
          description: Coefficient sum != 1
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/grades/{id}/history:
    get:
      tags: [Grade]
      summary: Get grade modification history (ADMIN only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradeHistoryResponse"

  # ==========================================
  # TRANSCRIPTS
  # ==========================================
  /api/transcripts/{studentId}:
    get:
      tags: [Transcript]
      summary: Generate a PDF academic transcript for a student (ADMIN)
      description: Generates PDF, uploads to AWS S3, and records history (§15).
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Binary PDF file of the transcript
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/transcripts/me:
    get:
      tags: [Transcript]
      summary: Download authenticated student's own PDF transcript (STUDENT)
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/transcripts/{studentId}/send-email:
    post:
      tags: [Transcript]
      summary: Request asynchronous email delivery of transcript (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: academicYearId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "222":
          description: Asynchronous email delivery event accepted

  # ==========================================
  # RANKING & GRADUATION
  # ==========================================
  /api/promotions/{promotionId}/parcours/{parcoursId}/diplomas/generate:
    post:
      tags: [Ranking & Graduation]
      summary: Generate ranking and determine graduate students (ADMIN)
      description: Determines graduates (overall average >= 10/20 on all mandatory courses over 3 years) and calculates rank.
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: parcoursId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiplomaResponse"

  /api/promotions/{promotionId}/parcours/{parcoursId}/diplomas:
    get:
      tags: [Ranking & Graduation]
      summary: Get graduates list and ranking for a track
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: parcoursId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiplomaResponse"

  # ==========================================
  # DIPLOMA EXCEL EXPORT
  # ==========================================
  /api/promotions/{promotionId}/diplomas/excel:
    get:
      tags: [DiplomaExcel]
      summary: Get pre-signed S3 download URL for an existing Excel file (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiplomaExcelResponse"
        "404":
          description: Excel file not generated yet

  /api/promotions/{promotionId}/diplomas/excel/generate:
    post:
      tags: [DiplomaExcel]
      summary: Generate graduates Excel file and persist link on S3 (ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - name: promotionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiplomaExcelResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request body or parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required or invalid token
    Forbidden:
      description: Access denied (Requires ADMIN or assigned TEACHER role)
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin@hei.mg
        password:
          type: string
          example: password123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        role:
          type: string
          example: ADMIN

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string

    CourseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseReference:
          type: string
          example: PROG4
        title:
          type: string
          example: Advanced Programming
        credits:
          type: integer
          example: 5
        active:
          type: boolean

    CourseRequest:
      type: object
      required: [courseReference, title, credits]
      properties:
        courseReference:
          type: string
        title:
          type: string
        credits:
          type: integer
          minimum: 1
          maximum: 30

    ParcoursResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: EL
        label:
          type: string
          example: Software Ecosystem
        active:
          type: boolean

    ParcoursRequest:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
        label:
          type: string

    ExamResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        label:
          type: string
        coefficientNumerator:
          type: integer
          example: 1
        coefficientDenominator:
          type: integer
          example: 2

    ExamRequest:
      type: object
      required: [courseId, academicYearId, semesterId, label, coefficientNumerator, coefficientDenominator]
      properties:
        courseId:
          type: string
          format: uuid
        academicYearId:
          type: string
          format: uuid
        semesterId:
          type: string
          format: uuid
        label:
          type: string
        coefficientNumerator:
          type: integer
        coefficientDenominator:
          type: integer

    GradeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        value:
          type: number
          format: float
          example: 15.5
        status:
          type: string
          example: DRAFT
        enteredAt:
          type: string
          format: date-time

    GradeRequest:
      type: object
      required: [studentId, examId, value]
      properties:
        studentId:
          type: string
          format: uuid
        examId:
          type: string
          format: uuid
        value:
          type: number
          minimum: 0
          maximum: 20

    GradeUpdateRequest:
      type: object
      required: [value, reason]
      properties:
        value:
          type: number
          minimum: 0
          maximum: 20
        reason:
          type: string
          example: Correction after student claim

    GradeHistoryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gradeId:
          type: string
          format: uuid
        oldValue:
          type: number
        newValue:
          type: number
        reason:
          type: string
        changedByUserId:
          type: string
          format: uuid
        changedAt:
          type: string
          format: date-time

    DiplomaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        studentNumber:
          type: string
          example: STD24049
        lastName:
          type: string
        firstName:
          type: string
        rank:
          type: integer
          example: 1
        overallAverage:
          type: number
          example: 16.42
        mention:
          type: string
          example: Distinction

    DiplomaExcelResponse:
      type: object
      properties:
        downloadUrl:
          type: string
          example: https://s3.amazonaws.com/bucket/diplomas/generated.xlsx

    ApiError:
      type: object
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time